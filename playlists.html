<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VintageTape Playlists - choose and customize your own catalog of Rock, Noise Pop, k-pop, Neo, J-pop and Indie.">
  <title>Playlists</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Iosevka+Charon:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <header class="site-nav">
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="VintageTape logo" class="logo-image">
      <span class="logo-text">VintageTape</span>
    </a>

    <nav class="nav-links" aria-label="Primary">
      <ul>
        <li><a href="index.html">Our Product</a></li>
        <li><a href="idea.html">Idea</a></li>
        <li><a href="playlists.html" class="active">Playlists(!)</a></li>
        <li><a href="contacts.html">Contacts</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="memory-section playlists-section">

      <img src="images/disc-float-left.png" alt="" class="floating-disc floating-disc-left" aria-hidden="true">
      <img src="images/disc-float-right.png" alt="" class="floating-disc floating-disc-right" aria-hidden="true">

      <div class="page-shell">

        <h1 class="playlists-title">Choose and Customize your Own Catalog and share with others!</h1>

        <div class="playlists-grid">

          <a class="playlist-card" href="#" data-genre="rock">
            <span class="playlist-arrow" aria-hidden="true">↗</span>
            <figure class="image-slot playlist-disc">
              <img src="images/disc-rock.png" alt="Rock playlist disc" class="card-image">
            </figure>
            <h2>Rock</h2>
          </a>

          <a class="playlist-card" href="#" data-genre="noise-pop">
            <span class="playlist-arrow" aria-hidden="true">↗</span>
            <figure class="image-slot playlist-disc">
              <img src="images/disc-noise-pop.png" alt="Noise Pop playlist disc" class="card-image">
            </figure>
            <h2>Noise Pop</h2>
          </a>

          <a class="playlist-card" href="#" data-genre="k-pop">
            <span class="playlist-arrow" aria-hidden="true">↗</span>
            <figure class="image-slot playlist-disc">
              <img src="images/disc-kpop.png" alt="K-pop playlist disc" class="card-image">
            </figure>
            <h2>k-pop</h2>
          </a>

          <a class="playlist-card" href="#" data-genre="neo">
            <span class="playlist-arrow" aria-hidden="true">↗</span>
            <figure class="image-slot playlist-disc">
              <img src="images/disc-neo.png" alt="Neo playlist disc" class="card-image">
            </figure>
            <h2>Neo</h2>
          </a>

          <a class="playlist-card" href="#" data-genre="j-pop">
            <span class="playlist-arrow" aria-hidden="true">↗</span>
            <figure class="image-slot playlist-disc">
              <img src="images/disc-jpop.png" alt="J-pop playlist disc" class="card-image">
            </figure>
            <h2>J-pop</h2>
          </a>

          <a class="playlist-card" href="#" data-genre="indie">
            <span class="playlist-arrow" aria-hidden="true">↗</span>
            <figure class="image-slot playlist-disc">
              <img src="images/disc-indie.png" alt="Indie playlist disc" class="card-image">
            </figure>
            <h2>Indie</h2>
          </a>

        </div>

      </div>
    </section>    
  </main>

  <footer class="site-footer">
    <div class="page-shell footer-content">
      <p> &copy 2026 VintageTape. Web Technologies Frontend. All rights reserved</p>
      <p class="footer-copy">Questions? <a href="https://lms.astanait.edu.kz/login/index.php?loginredirect=1">MT2503@astanait.edu.kz</a></p>
    </div>
  </footer>

</body>
</html>
